<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wish Ripple Hero - Enhanced Animation</title>
  <style>
    .error { color: red; display: none; margin-top: 10px; }
    /* 🔁 Customize */
    :root{
      --bg-color: #000000;
      --tint: rgba(0,0,0,0.8);
      --accent: #b30000;
      --accent-secondary: #f72585;
      --wish-gold: #ffd700;
      --wish-pink: #ff6b9d;
      --text: #ffffff;
      --muted: #c8d2db;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg-color); color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .hero{
      position:relative; min-height:100vh; overflow:hidden; isolation:isolate;
      display:grid; place-items:center;
      background: var(--bg-color);
    }
    .hero::before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(45deg, #b30000, transparent 30%, black 70%, transparent),
                  radial-gradient(circle at 20% 20%, rgba(255,215,0,0.05) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(255,107,157,0.05) 0%, transparent 50%);
      z-index:0;
      animation: waveBackground 10s linear infinite;
    }

    @keyframes waveBackground {
      0% {
        background-position: 0 0, 0 0, 0 0;
      }
      50% {
        background-position: 100px 100px, -50px -50px, 50px 50px;
      }
      100% {
        background-position: 200px 200px, -100px -100px, 100px 100px;
      }
    }

    .ripple-mask{
      position:absolute; inset:0; z-index:1;
      background: radial-gradient(60% 60% at 50% 50%, rgba(76,201,240,.15), transparent 70%);
    }

    .ripple-hole{
      position:absolute; inset:0;
      clip-path: circle(50% at 50% 50%);
      background: transparent;
      animation: none; /* Removed reveal animation to keep it static */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .ring, .ring2, .ring3{
      position:absolute; left:50%; top:50%;
      width:20vmin; height:20vmin; border-radius:50%;
      transform: translate(-50%,-50%) scale(0.1);
      opacity:0;
    }
    .ring {
      border: 2px solid rgba(255,255,255,.45);
      box-shadow: 0 0 30px rgba(76,201,240,.35), inset 0 0 12px rgba(255,255,255,.25);
      animation: ringOut 1.4s .05s ease-out forwards, pulseRing 3s 2s ease-in-out infinite;
    }
    .ring2 {
      border: 2px solid rgba(76,201,240,.75);
      box-shadow: 0 0 40px rgba(76,201,240,.5), inset 0 0 15px rgba(76,201,240,.3);
      animation: ringOut 1.6s .15s ease-out forwards, pulseRing 3.2s 2.2s ease-in-out infinite;
    }
    .ring3 {
      border: 1px solid #b30000;
      box-shadow: 0 0 50px #b30000;
      animation: ringOut 1.8s .25s ease-out forwards, pulseRing 3.4s 2.4s ease-in-out infinite;
    }

    @keyframes ringOut {
      0%   { transform: translate(-50%,-50%) scale(.1); opacity:0; }
      15%  { opacity:1; }
      100% { transform: translate(-50%,-50%) scale(6); opacity:0; }
    }
    @keyframes pulseRing {
      0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%,-50%) scale(1.2); opacity: 0.6; }
    }
    @keyframes subtleParallax {
      0% { background-position: 0 0; }
      100% { background-position: 100px 100px; }
    }

    .content{
      position:relative; z-index:10; /* ensure above decorations */
      text-align:center; max-width: 900px; padding: 0 6vw;
      opacity:0; transform: translateY(16px);
      animation: contentIn 1.2s .85s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      margin-top: 0; /* Centered, no offset */
    }
    .logo1{
      display:block;
      margin: 0 auto; /* Center the logo horizontally */
      position:relative;
      top: 0;
      z-index: 3;
      width: 150px;
      height: auto;
      animation: scalePulse 4s ease-in-out infinite;
      filter: drop-shadow(0 0 15px rgba(76, 201, 240, 0.5));
    }
    h1{
      margin:.2rem 0 .5rem; font-size:clamp(28px,6vw,60px); letter-spacing:-.02em; line-height:1.05;
      text-shadow: 0 6px 30px rgba(0,0,0,.35);
      opacity: 0; /* Start hidden */
      transform: scale(0.8);
      margin-top: 0; /* Centered */
    }

    .lead{
      margin:0 auto 20px; color:var(--muted); font-size: clamp(14px,2.4vw,18px); line-height:1.6;
      max-width: 720px;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUpIn 1s 1.6s ease-out forwards;
    }
    .cta{
      display:inline-flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:center;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUpIn 1s 1.8s ease-out forwards;
    }
    .btn{
      padding:12px 18px; border-radius:999px; border:1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.1); color:#fff; text-decoration:none; font-weight:700;
      transition: transform .3s ease, box-shadow .3s ease, background .3s ease, filter .3s ease;
      backdrop-filter: blur(6px);
      position: relative;
      overflow: hidden;
    }
    .btn--primary{ 
      background: var(--accent); 
      color:#03161c; 
      border-color: transparent; 
      box-shadow: 0 4px 15px rgba(76, 201, 240, 0.3);
      animation: buttonGlow 2s ease-in-out infinite alternate;
    }
    .btn:hover{ 
      transform: translateY(-3px); 
      box-shadow: 0 12px 30px rgba(0,0,0,.4);
      filter: brightness(1.1);
    }
    .btn--primary:hover {
      box-shadow: 0 12px 30px rgba(76, 201, 240, 0.4);
      animation: none; /* Pause glow on hover for better readability */
    }
    .btn:active {
      transform: translateY(0);
      transition: transform 0.1s ease;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        to bottom right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0.1) 45%,
        rgba(255, 255, 255, 0.3) 50%,
        rgba(255, 255, 255, 0.1) 55%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(30deg);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .btn:hover::after {
      animation: shine 1.5s ease-out;
    }

    @keyframes shine {
      0% {
        opacity: 0;
        transform: rotate(30deg) translate(0, -150%);
      }
      20% {
        opacity: 1;
      }
      70% {
        opacity: 0.5;
      }
      100% {
        opacity: 0;
        transform: rotate(30deg) translate(0, 150%);
      }
    }

    @keyframes buttonGlow {
      from {
        box-shadow: 0 4px 15px rgba(76, 201, 240, 0.3), 0 0 10px rgba(76, 201, 240, 0.2);
      }
      to {
        box-shadow: 0 4px 15px rgba(76, 201, 240, 0.3), 0 0 20px rgba(76, 201, 240, 0.5);
      }
    }

    @keyframes contentIn { 
      to{ opacity:1; transform:translateY(0) } 
    }
    
    @keyframes fadeUpIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      70% {
        opacity: 1;
        transform: scale(1.1);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes scalePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .floating-logo-img {
      position: absolute;
      bottom: -100px;
      width: 80px;
      height: 80px;
      opacity: 0;
      z-index: 2;
      animation: waveDrift linear infinite;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 0 12px rgba(76, 201, 240, 0.6));
      pointer-events: none; /* ← ignore clicks */
    }
    
    .pulse-effect {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 10%, rgba(76, 201, 240, 0.1) 20%, transparent 30%);
      opacity: 0;
      z-index: 1;
      animation: pulse 8s ease-in-out infinite;
      pointer-events: none; /* ← ignore clicks */
    }
    
    @keyframes pulse {
      0%, 100% {
        opacity: 0;
        transform: scale(1);
      }
      50% {
        opacity: 0.6;
        transform: scale(1.1);
      }
    }
    
    @keyframes waveDrift {
      0% {
        transform: translateY(0) translateX(0) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      50% {
        transform: translateY(-50vh) translateX(calc(15vw * sin(1.5 * 3.14159))) scale(1.2) rotate(10deg);
        opacity: 0.9;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-100vh) translateX(calc(20vw * sin(3 * 3.14159))) scale(0.8) rotate(20deg);
        opacity: 0;
      }
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: radial-gradient(circle, var(--accent) 10%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      animation: floatParticle 10s linear infinite;
      opacity: 0.4;
      pointer-events: none; /* ← ignore clicks */
    }

    @keyframes floatParticle {
      0% {
        transform: translate(0, 0) scale(0.5);
        opacity: 0.4;
      }
      50% {
        opacity: 0.7;
        transform: translate(calc(20vw * (sin(2 * 3.14159))), -50vh) scale(1);
      }
      100% {
        transform: translate(calc(30vw * (sin(3 * 3.14159))), -100vh) scale(0.5);
        opacity: 0;
      }
    }

    .starburst {
      position: absolute;
      width: 5px;
      height: 5px;
      background: radial-gradient(circle, var(--wish-gold) 20%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      animation: starburstExpand 1.5s ease-out forwards;
      opacity: 0;
      pointer-events: none; /* ← ignore clicks */
    }

    @keyframes starburstExpand {
      0% {
        transform: scale(0) rotate(0deg);
        opacity: 0.8;
      }
      50% {
        opacity: 1;
        transform: scale(2) rotate(180deg);
      }
      100% {
        transform: scale(5) rotate(360deg);
        opacity: 0;
      }
    }

    .popup-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    
    .popup-modal.active {
      opacity: 1;
      visibility: visible;
    }
    
    .popup-content {
      background: linear-gradient(145deg, rgba(20, 20, 30, 0.95), rgba(10, 10, 20, 0.95));
      border: 1px solid rgba(76, 201, 240, 0.3);
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(76, 201, 240, 0.3);
      backdrop-filter: blur(10px);
      transform: scale(0.9);
      transition: transform 0.3s ease;
      position: relative;
    }
    
    .popup-modal.active .popup-content {
      transform: scale(1);
    }
    
    .popup-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
      transition: color 0.3s ease;
    }
    
    .popup-close:hover {
      color: var(--accent);
    }
    
    .popup-title,
    .popup-text,
    .popup-input,
    .popup-btn {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    
    .popup-title {
      color: var(--accent);
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }
    
    .popup-text {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 20px;
      font-size: 16px;
      text-align: center;
    }
    
    .popup-input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid rgba(76, 201, 240, 0.3);
      background: rgba(10, 15, 20, 0.7);
      color: white;
      margin-bottom: 15px;
      font-size: 16px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    
    .popup-input::placeholder {
      color: rgba(200, 210, 219, 0.6);
      font-style: italic;
    }
    
    .popup-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.2);
    }
    
    .popup-btn {
      padding: 12px 25px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #03161c;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      width: 100%;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .popup-btn:hover {
      background: #3ab4d9;
      transform: translateY(-2px);
    }

    .clickable-text {
      cursor: pointer; /* ensure pointer cursor */
      position: relative;
      display: inline-block;
      color: var(--accent);
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }
    
    .clickable-text:hover {
      color: #fff;
      text-shadow: 0 0 10px var(--accent);
    }
    
    .clickable-text::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }
    
    .clickable-text:hover::after {
      opacity: 1;
    }

    .email-input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 12px 20px;
      border-radius: 999px;
      min-width: 250px;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }
    
    .email-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.2);
      background: rgba(255, 255, 255, 0.12);
    }
    
    .email-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      33% {
        transform: translateY(-10px) rotate(2deg);
      }
      66% {
        transform: translateY(5px) rotate(-2deg);
      }
    }

    .sparkle {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      pointer-events: none; /* ← ignore clicks */
      z-index: 5;
      animation: sparkle 1s ease-out forwards;
    }
    
    @keyframes sparkle {
      0% {
        opacity: 1;
        transform: scale(0) translate(0, 0);
      }
      100% {
        opacity: 0;
        transform: scale(1) translate(var(--tx), var(--ty));
      }
    }

    .typing-text {
      overflow: hidden;
      border-right: 2px solid var(--accent);
      white-space: nowrap;
      animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
    }
    
    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }
    
    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: var(--accent) }
    }

    .glow-pulse {
      animation: glowPulse 2s ease-in-out infinite alternate;
    }
    
    @keyframes glowPulse {
      from {
        filter: drop-shadow(0 0 5px rgba(76, 201, 240, 0.5));
      }
      to {
        filter: drop-shadow(0 0 20px rgba(76, 201, 240, 0.8));
      }
    }

    /* Make the decorative rings non-interactive so clicks reach the text */
    .ring, .ring2, .ring3 { pointer-events: none; }

    @media (prefers-reduced-motion: reduce){
      .ripple-hole, .ring, .ring2, .ring3 { animation: none !important; clip-path:none !important; }
      .content, .logo1, h1, .lead, .cta { opacity:1; transform:none; animation:none; }
      .floating-logo-img, .particle, .starburst { 
        animation: none !important; 
        display:none; 
      }
      .pulse-effect { animation: none !important; }
      .btn::after { display: none; }
      .popup-content {
        transform: none !important;
        transition: none;
      }
      .logo1 {
        animation: none !important;
      }
      .sparkle {
        display: none !important;
      }
      .typing-text {
        animation: none !important;
        border-right: none !important;
        white-space: normal !important;
      }
      .hero::before {
        animation: none !important;
      }
    }
    @font-face {
  font-family: 'Ashford Bold';
  src: url('fonts/ashford-bold-italic.otf') format('opentype');
  font-weight: bold;
  font-style: normal;
}

h1 {
  font-family: 'Ashford Bold', sans-serif;
}

  </style>
</head>
<body>
  <section class="hero">
    <div class="ripple-mask">
      <div class="ripple-hole">
        <div id="floating-logos"></div>
        <div id="particles"></div>
        <div id="starbursts"></div>
        <div class="content">
          <img
            class="logo1 glow-pulse"
            src="images\background\logo2.png"
            alt="Wish Group"
            width="150" height="80"
          />
          <h1>We make a WISH… and the magic unfolds.</h1>
          <br/>
          <h4 class="lead">
            Enter your email to see how.
            <span class="clickable-text" id="show-popup" role="button" tabindex="0">Click Here</span>
          </h4>
          <div class="cta">
            <input 
              type="email" 
              class="email-input" 
              placeholder="Enter your email address"
              required
              id="email-input"
            />
            <button class="btn btn--primary" id="submit-btn">Submit</button>
          </div>
        </div>
      </div>
      <div class="ring"></div>
      <div class="ring2"></div>
      <div class="ring3"></div>
    </div>
    
    <div class="pulse-effect"></div>
  </section>x`

  <div class="popup-modal" id="popup-modal">
    <div class="popup-content">
      <button class="popup-close" id="close-popup">×</button>
      <h2 class="popup-title">Join the Magic</h2>
      <p class="popup-text" id="popup-message">Enter your email to unlock the wonders of Wish Group!</p>
      <input type="email" class="popup-input" placeholder="Your email address" required id="popup-email-input">
      <button class="popup-btn" id="popup-submit-btn">Submit</button>
    </div>
  </div>

<script>
// Existing animation code (unchanged, kept for context)
document.addEventListener('DOMContentLoaded', () => {
  const logoContainer = document.getElementById('floating-logos');
  const particleContainer = document.getElementById('particles');
  const starburstContainer = document.getElementById('starbursts');
  const logoCount = 40;
  const particleCount = 20;
  const starburstCount = 10;

  function createLogo() {
    const logo = document.createElement('div');
    logo.className = 'floating-logo-img';
    logo.style.backgroundImage = 'url("images/background/logoslide.png")';
    const size = 40 + Math.random() * 80;
    const left = Math.random() * 100;
    const delay = Math.random() * 5;
    const duration = 15 + Math.random() * 20;
    logo.style.width = `${size}px`;
    logo.style.height = `${size}px`;
    logo.style.left = `${left}%`;
    logo.style.animationDelay = `${delay}s`;
    logo.style.animationDuration = `${duration}s`;
    logo.style.opacity = `${0.5 + Math.random() * 0.5}`;
    logo.style.transform = `rotate(${Math.random() * 360}deg)`;
    logoContainer.appendChild(logo);
    setTimeout(() => {
      logo.remove();
      createLogo();
    }, (duration + delay) * 1000);
  }

  function createParticle() {
    const particle = document.createElement('div');
    particle.className = 'particle';
    const size = 6 + Math.random() * 6;
    const left = Math.random() * 100;
    const delay = Math.random() * 5;
    const duration = 10 + Math.random() * 10;
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;
    particle.style.left = `${left}%`;
    particle.style.animationDelay = `${delay}s`;
    particle.style.animationDuration = `${duration}s`;
    particleContainer.appendChild(particle);
    setTimeout(() => {
      particle.remove();
      createParticle();
    }, (duration + delay) * 1000);
  }

  function createStarburstAuto() {
    const star = document.createElement('div');
    star.className = 'starburst';
    const angle = Math.random() * 360;
    const distance = Math.random() * 50;
    const x = 50 + Math.cos(angle * Math.PI / 180) * distance;
    const y = 50 + Math.sin(angle * Math.PI / 180) * distance;
    star.style.left = `${x}%`;
    star.style.top = `${y}%`;
    starburstContainer.appendChild(star);
    setTimeout(() => {
      star.remove();
    }, 1500);
  }

  for (let i = 0; i < logoCount; i++) {
    setTimeout(createLogo, i * 300);
  }
  for (let i = 0; i < particleCount; i++) {
    setTimeout(createParticle, i * 400);
  }
  setInterval(() => {
    for (let i = 0; i < starburstCount; i++) {
      setTimeout(createStarburstAuto, i * 100);
    }
  }, 5000);

  const popupModal = document.getElementById('popup-modal');
  const showPopupBtn = document.getElementById('show-popup');
  const closePopupBtn = document.getElementById('close-popup');
  const submitBtn = document.getElementById('submit-btn');
  const emailInput = document.getElementById('email-input');
  const popupEmailInput = document.getElementById('popup-email-input');
  const popupMessage = document.getElementById('popup-message');
  const popupSubmitBtn = document.getElementById('popup-submit-btn');

  // Show popup (mouse)
  if (showPopupBtn) {
    showPopupBtn.addEventListener('click', () => {
      popupModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
    showPopupBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        popupModal.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
    });
  }

  // Close popup
  if (closePopupBtn) {
    closePopupBtn.addEventListener('click', () => {
      popupModal.classList.remove('active');
      document.body.style.overflow = '';
      popupMessage.textContent = 'Enter your email to unlock the wonders of Wish Group!';
      popupEmailInput.value = '';
    });
  }

  if (popupModal) {
    popupModal.addEventListener('click', (e) => {
      if (e.target === popupModal) {
        popupModal.classList.remove('active');
        document.body.style.overflow = '';
        popupMessage.textContent = 'Enter your email to unlock the wonders of Wish Group!';
        popupEmailInput.value = '';
      }
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && popupModal.classList.contains('active')) {
      popupModal.classList.remove('active');
      document.body.style.overflow = '';
      popupMessage.textContent = 'Enter your email to unlock the wonders of Wish Group!';
      popupEmailInput.value = '';
    }
  });

  // Animation-related event listeners (unchanged)
  document.addEventListener('mousemove', (e) => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const x = e.clientX / window.innerWidth;
    const y = e.clientY / window.innerHeight;
    const content = document.querySelector('.content');
    content.style.transform = `translate(${(x - 0.5) * 10}px, ${(y - 0.5) * 10}px)`;
    const rings = document.querySelectorAll('.ring, .ring2, .ring3');
    rings.forEach(ring => {
      ring.style.transform = `translate(calc(-50% + ${(x - 0.5) * 5}px), calc(-50% + ${(y - 0.5) * 5}px)) scale(0.1)`;
    });
    if (e.buttons === 1) createFloatingLogo(e.clientX, e.clientY);
    if (Math.random() > 0.97) createSparkle(e.clientX, e.clientY);
  });

  function createFloatingLogo(x, y) {
    const logo = document.createElement('div');
    logo.className = 'floating-logo-img';
    logo.style.backgroundImage = 'url("images/background/logoslide.png")';
    const size = 40 + Math.random() * 80;
    logo.style.width = `${size}px`;
    logo.style.height = `${size}px`;
    logo.style.left = `${x}px`;
    logo.style.top = `${y}px`;
    logo.style.animationDuration = `${15 + Math.random() * 15}s`;
    logoContainer.appendChild(logo);
    setTimeout(() => {
      logo.remove();
      createLogo();
    }, 30000);
  }

  function createSparkle(x, y) {
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    const size = Math.random() * 4 + 2;
    sparkle.style.width = `${size}px`;
    sparkle.style.height = `${size}px`;
    sparkle.style.left = `${x}px`;
    sparkle.style.top = `${y}px`;
    const tx = (Math.random() - 0.5) * 100;
    const ty = (Math.random() - 0.5) * 100;
    sparkle.style.setProperty('--tx', `${tx}px`);
    sparkle.style.setProperty('--ty', `${ty}px`);
    document.body.appendChild(sparkle);
    setTimeout(() => {
      sparkle.remove();
    }, 1000);
  }

  document.addEventListener('click', (e) => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    createFloatingLogo(e.clientX, e.clientY);
    createSparkle(e.clientX, e.clientY);
    for (let i = 0; i < 10; i++) {
      setTimeout(() => createStarburstClick(e.clientX, e.clientY), i * 100);
    }
  });

  function createStarburstClick(x, y) {
    const star = document.createElement('div');
    star.className = 'starburst';
    const angle = Math.random() * 360;
    const distance = Math.random() * 50;
    const offsetX = Math.cos(angle * Math.PI / 180) * distance;
    const offsetY = Math.sin(angle * Math.PI / 180) * distance;
    star.style.left = `${x + offsetX}px`;
    star.style.top = `${y + offsetY}px`;
    starburstContainer.appendChild(star);
    setTimeout(() => {
      star.remove();
    }, 1500);
  }

  document.addEventListener('mouseleave', () => {
    const content = document.querySelector('.content');
    content.style.transform = '';
    const rings = document.querySelectorAll('.ring, .ring2, .ring3');
    rings.forEach(ring => {
      ring.style.transform = '';
    });
  });

  const heading = document.querySelector('h1');
  if (heading) {
    setTimeout(() => {
      heading.style.opacity = '1';
      heading.classList.add('typing-text');
      const text = heading.textContent;
      heading.textContent = '';
      heading.style.width = '0';
      setTimeout(() => {
        heading.textContent = text;
        heading.classList.remove('typing-text');
        heading.style.width = '';
      }, 3500);
    }, 6000);
  }

  // Subscription logic
  const API_BASE = 'https://wishgroup.ae/api'; // Adjust if server is on different host/port
  const REDIRECT_URL = '/index.html'; // Change to your desired redirect URL

  async function handleSubscribe(event, emailInputId, errorElementId) {
    event.preventDefault();
    const emailInput = document.getElementById(emailInputId);
    const errorElement = document.getElementById(errorElementId);
    const email = emailInput.value.trim();

    if (!email) {
      errorElement.textContent = 'Please enter your email to proceed!';
      errorElement.style.display = 'block';
      return;
    }

    try {
      console.log(`Submitting email: ${email}`); // Debug log
      const res = await fetch(`${API_BASE}/subscribe`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      console.log('API Response:', data); // Debug log

      if (res.ok) {
        console.log('Subscription successful, redirecting...');
        emailInput.value = ''; // Clear input
        errorElement.style.display = 'none';
        window.location.href = REDIRECT_URL; // Redirect on success
      } else {
        errorElement.textContent = data.error || 'Subscription failed';
        errorElement.style.display = 'block';
        console.error('Subscription error:', data.error);
      }
    } catch (err) {
      errorElement.textContent = 'Error connecting to server';
      errorElement.style.display = 'block';
      console.error('Fetch error:', err.message, err.stack);
    }
  }

  // Attach event listeners
  submitBtn.addEventListener('click', (e) => handleSubscribe(e, 'email-input', 'popup-message')); // Use popup-message for main form errors
  popupSubmitBtn.addEventListener('click', (e) => handleSubscribe(e, 'popup-email-input', 'popup-message'));
});
</script>
</body>
