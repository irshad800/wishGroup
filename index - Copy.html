<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Section - Wish Group</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #0a0a1a;
            color: #fff;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #e10600, #9c07c6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .team-description {
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        .team-container {
            position: relative;
            min-height: 600px;
            margin: 40px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(10, 10, 30, 0.7);
            overflow: hidden;
        }
        
        .team-member {
            position: absolute;
            width: 200px;
            height: 280px;
            transition: all 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
            z-index: 1;
        }
        
        .team-member.center {
            z-index: 10;
            transform: scale(1.1);
        }
        
        .member-img-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        /* Improved image styling for clarity */
        .member-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            image-rendering: auto;
            filter: brightness(0.95);
        }
        
        .team-member:hover .member-img {
            transform: scale(1.05);
        }
        
        .member-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            padding: 20px 15px 15px;
            color: white;
            transform: translateY(10px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        
        .team-member:hover .member-overlay {
            opacity: 1;
            transform: translateY(0);
        }
        
        .member-name {
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .member-role {
            font-size: 12px;
            opacity: 0.8;
            margin: 0;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 25px;
            background: linear-gradient(45deg, #e10600, #9c07c6);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(225, 6, 0, 0.4);
        }
        
        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
        }
        
        .shape-1 {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #e10600, #9c07c6);
            top: -150px;
            right: -150px;
        }
        
        .shape-2 {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #9c07c6, #e10600);
            bottom: -100px;
            left: -100px;
        }
        
        /* Ensure responsiveness for smaller screens */
        @media (max-width: 768px) {
            .team-container {
                min-height: 500px;
            }
            
            .team-member {
                width: 150px;
                height: 210px;
            }
            
            .member-name {
                font-size: 14px;
            }
            
            .member-role {
                font-size: 11px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
        }
        
        @media (max-width: 576px) {
            .team-container {
                min-height: 400px;
            }
            
            .team-member {
                width: 130px;
                height: 180px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Meet Our Visionaries</h1>
            <p class="team-description">
                Our diverse team of innovators and strategists work together to transform ideas into reality. 
                With expertise across multiple disciplines, we're united by our passion for excellence and innovation.
            </p>
        </div>
        
        <div class="team-container" id="teamContainer">
            <!-- Team members will be positioned here by JavaScript -->
        </div>
        
        <div class="controls">
            <button id="replayButton" class="btn">Replay Animation</button>
            <button id="viewTeamButton" class="btn">View Full Team</button>
        </div>
    </div>
    
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const teamContainer = document.getElementById('teamContainer');
            const replayButton = document.getElementById('replayButton');
            const viewTeamButton = document.getElementById('viewTeamButton');
            
            const teamMembers = [
                {
                    name: "Aman Fatima",
                    role: "Secretary - Prime wish",
                    img: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=400&q=80"
                },
                {
                    name: "Sabeena Sadhique",
                    role: "Executive Secretary",
                    img: "https://images.unsplash.com/photo-1580489944761-15a19d654956?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=400&q=80"
                },
                {
                    name: "Sahala Salim",
                    role: "Media Secretary",
                    img: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=400&q=80"
                },
                {
                    name: "Naifa Anwar",
                    role: "Secretary - Wish Holdings",
                    img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=400&q=80"
                },
                {
                    name: "Manjima TV",
                    role: "Accountant - Prime wish",
                    img: "https://images.unsplash.com/photo-1552058544-f2b08422138a?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=400&q=80"
                },
                {
                    name: "Arya Biju",
                    role: "Accountant - WCC",
                    img: "https://images.unsplash.com/photo-1567532939604-b6b5b0db2604?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=400&q=80"
                }
            ];

            // Create team member elements
            function createTeamMembers() {
                teamContainer.innerHTML = '';
                
                teamMembers.forEach((member, index) => {
                    const memberElement = document.createElement('div');
                    memberElement.className = 'team-member';
                    memberElement.innerHTML = `
                        <div class="member-img-container">
                            <img src="${member.img}" class="member-img" alt="${member.name}">
                            <div class="member-overlay">
                                <h3 class="member-name">${member.name}</h3>
                                <p class="member-role">${member.role}</p>
                            </div>
                        </div>
                    `;
                    teamContainer.appendChild(memberElement);
                });
            }

            // Initial random shuffle positions
            function setRandomPositions() {
                const members = document.querySelectorAll('.team-member');
                const containerWidth = teamContainer.offsetWidth;
                const containerHeight = teamContainer.offsetHeight;
                
                members.forEach(member => {
                    const randomX = Math.random() * (containerWidth - 200);
                    const randomY = Math.random() * (containerHeight - 250);
                    
                    member.style.left = `${randomX}px`;
                    member.style.top = `${randomY}px`;
                    member.style.opacity = '1';
                    member.classList.remove('center');
                });
            }

            // Arrange in circular formation
            function arrangeInCircle() {
                const members = document.querySelectorAll('.team-member');
                const centerX = teamContainer.offsetWidth / 2;
                const centerY = teamContainer.offsetHeight / 2;
                const radius = Math.min(centerX, centerY) * 0.7;
                
                // Set center member
                const centerMember = members[0];
                centerMember.style.left = `${centerX - 100}px`;
                centerMember.style.top = `${centerY - 125}px`;
                centerMember.classList.add('center');
                
                // Arrange other members in a circle
                for (let i = 1; i < members.length; i++) {
                    const angle = (2 * Math.PI * (i-1)) / (members.length - 1);
                    const x = centerX + radius * Math.cos(angle) - 100;
                    const y = centerY + radius * Math.sin(angle) - 125;
                    
                    members[i].style.left = `${x}px`;
                    members[i].style.top = `${y}px`;
                    members[i].classList.remove('center');
                }
                
                // After circle animation, arrange in two rows
                setTimeout(() => {
                    arrangeInTwoRows();
                }, 4000);
            }

            // Arrange in two rows
            function arrangeInTwoRows() {
                const members = document.querySelectorAll('.team-member');
                const containerWidth = teamContainer.offsetWidth;
                const memberWidth = 200;
                const memberHeight = 280;
                const spacing = 20;
                
                const perRow = Math.ceil(members.length / 2);
                const totalWidth = (memberWidth + spacing) * perRow - spacing;
                const startX = (containerWidth - totalWidth) / 2;
                
                // First row (bottom row)
                for (let i = 0; i < perRow; i++) {
                    if (!members[i]) break;
                    members[i].classList.remove('center');
                    members[i].style.left = `${startX + i * (memberWidth + spacing)}px`;
                    members[i].style.top = `${teamContainer.offsetHeight - memberHeight - 20}px`;
                }
                
                // Second row (top row)
                for (let i = perRow; i < members.length; i++) {
                    members[i].classList.remove('center');
                    members[i].style.left = `${startX + (i - perRow) * (memberWidth + spacing)}px`;
                    members[i].style.top = `${teamContainer.offsetHeight - (memberHeight * 2) - 40}px`;
                }
            }

            // Animate the transition
            function animateTeam() {
                createTeamMembers();
                
                // Initial state: random positions
                setRandomPositions();
                
                // After a delay, arrange in circle
                setTimeout(() => {
                    arrangeInCircle();
                }, 2000);
            }

            // Initialize animation
            animateTeam();
            
            // Replay animation on button click
            replayButton.addEventListener('click', function() {
                animateTeam();
            });
            
            // View full team on button click
            viewTeamButton.addEventListener('click', function() {
                arrangeInTwoRows();
            });
        });
    </script>
</body>
</html>
